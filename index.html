<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة بطلة السلوك الإيجابي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF7EA;
    --bg-deep: #FFEFD6;
    --ink: #23304B;
    --ink-soft: #5B6685;
    --blue: #2E86EE;
    --blue-deep: #1C63C4;
    --yellow: #FFC94D;
    --yellow-deep: #E8A70F;
    --orange: #FF8A3D;
    --orange-deep: #E06A1E;
    --green: #2FBE84;
    --green-deep: #1E9B69;
    --purple: #8B6DF0;
    --purple-deep: #6C4FD1;
    --red: #F0553F;
    --white: #FFFFFF;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --shadow-soft: 0 14px 30px -12px rgba(35,48,75,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,201,77,0.35), transparent 40%),
      radial-gradient(circle at 90% 82%, rgba(46,134,238,0.18), transparent 45%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Baloo Bhaijaan 2',sans-serif;
  }
  button{font-family:inherit;cursor:pointer;border:none;}
  #app{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    padding:18px 18px 40px;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- HUD ---------- */
  .hud{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--white);
    border-radius:999px;
    padding:8px 18px;
    box-shadow:var(--shadow-soft);
    margin-bottom:22px;
    gap:10px;
    flex-wrap:wrap;
  }
  .hud-item{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--ink-soft);}
  .hud-item b{color:var(--ink);font-size:16px;}
  .hud-btn{
    background:var(--bg-deep);
    border-radius:50%;
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .hud-back{background:var(--bg-deep);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;color:var(--ink-soft);}

  /* ---------- HOME ---------- */
  .home-hero{
    text-align:center;
    background:linear-gradient(160deg, var(--blue) 0%, var(--purple) 100%);
    border-radius:var(--radius-lg);
    padding:34px 22px 26px;
    color:white;
    box-shadow:var(--shadow-soft);
    position:relative;
    overflow:hidden;
  }
  .home-hero::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.16) 2px, transparent 2px);
    background-size:26px 26px;
    opacity:.5;
  }
  .home-hero-inner{position:relative;z-index:1;}
  .hero-emoji{font-size:64px;display:block;margin-bottom:6px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.2));}
  .home-title{font-size:34px;font-weight:800;margin:6px 0 4px;}
  .home-sub{font-size:17px;font-weight:700;opacity:.95;margin:0 0 18px;}
  .cta-btn{
    background:var(--yellow);
    color:#5B3B00;
    font-weight:800;
    font-size:19px;
    padding:16px 36px;
    border-radius:999px;
    box-shadow:0 10px 0 var(--yellow-deep);
    transition:transform .08s ease;
  }
  .cta-btn:active{transform:translateY(6px);box-shadow:0 4px 0 var(--yellow-deep);}
  .home-actions{
    display:flex;
    gap:12px;
    margin-top:20px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .ghost-btn{
    background:rgba(255,255,255,0.18);
    color:white;
    font-weight:700;
    font-size:14px;
    padding:10px 18px;
    border-radius:999px;
    border:1.5px solid rgba(255,255,255,0.5);
  }
  .points-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,0.2);
    padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;margin-top:14px;
  }

  /* ---------- MAP / PATH ---------- */
  .map-title{font-size:24px;font-weight:800;margin:24px 4px 4px;}
  .map-sub{color:var(--ink-soft);font-weight:600;margin:0 4px 18px;font-size:14px;}
  .path{
    display:flex;
    flex-direction:column;
    gap:6px;
    position:relative;
  }
  .path-node-row{display:flex;align-items:center;gap:14px;}
  .path-node-row.right{justify-content:flex-start;}
  .path-node-row.left{justify-content:flex-end;flex-direction:row-reverse;}
  .connector{
    width:3px;
    height:26px;
    background-repeat:repeat-y;
    background-image:linear-gradient(var(--ink-soft) 55%, transparent 45%);
    background-size:3px 12px;
    opacity:.35;
    margin:0 34px;
    align-self:center;
  }
  .node{
    display:flex;align-items:center;gap:14px;
    background:var(--white);
    border-radius:999px;
    padding:10px 20px 10px 10px;
    box-shadow:var(--shadow-soft);
    flex:1;
    max-width:480px;
    position:relative;
  }
  .path-node-row.left .node{padding:10px 10px 10px 20px;flex-direction:row-reverse;text-align:left;}
  .node-badge{
    width:56px;height:56px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    color:white;
    flex-shrink:0;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.14);
  }
  .node-text{flex:1;}
  .node-title{font-weight:800;font-size:16px;margin:0 0 2px;}
  .node-desc{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin:0;}
  .node.locked{opacity:.55;}
  .node.locked .node-badge{filter:grayscale(1);}
  .node.done::after{
    content:"✓";
    position:absolute; top:-6px; left:-6px;
    background:var(--green); color:white;
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:800;
    box-shadow:0 3px 6px rgba(0,0,0,.18);
  }
  .path-node-row.left .node.done::after{left:auto;right:-6px;}
  .lock-icon{font-size:14px;margin-inline-start:6px;}

  /* ---------- CHALLENGE SCREEN ---------- */
  .stage{
    background:var(--white);
    border-radius:var(--radius-lg);
    padding:26px 22px;
    box-shadow:var(--shadow-soft);
    position:relative;
    animation:pop-in .25s ease;
  }
  @keyframes pop-in{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
  .level-tag{
    display:inline-flex;align-items:center;gap:6px;
    font-weight:800;font-size:13px;
    padding:5px 14px;border-radius:999px;
    color:white;margin-bottom:14px;
  }
  .prompt{font-size:19px;font-weight:800;line-height:1.6;margin:0 0 20px;}
  .timer-bar{
    height:8px;border-radius:999px;background:var(--bg-deep);overflow:hidden;margin-bottom:18px;
  }
  .timer-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--red));border-radius:999px;transition:width .1s linear;}

  .options{display:flex;flex-direction:column;gap:12px;}
  .opt-card{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-deep);
    border-radius:var(--radius-md);
    padding:14px 16px;
    font-weight:700;
    font-size:15.5px;
    text-align:right;
    border:2.5px solid transparent;
    transition:transform .08s ease, border-color .15s ease, background .15s ease;
    color:var(--ink);
  }
  .opt-card:hover{transform:translateY(-2px);}
  .opt-card:active{transform:translateY(0);}
  .opt-card .opt-emoji{font-size:20px;flex-shrink:0;}
  .opt-card.correct{background:#DFF6EA;border-color:var(--green);}
  .opt-card.wrong{background:#FDE4E0;border-color:var(--red);animation:shake .35s;}
  .opt-card.disabled{pointer-events:none;opacity:.65;}
  .opt-card.disabled.correct, .opt-card.disabled.wrong{opacity:1;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }

  .tf-row{display:flex;gap:14px;}
  .tf-btn{
    flex:1;
    padding:22px 10px;
    border-radius:var(--radius-md);
    font-weight:800;
    font-size:18px;
    background:var(--bg-deep);
    border:2.5px solid transparent;
  }

  .order-list{display:flex;flex-direction:column;gap:10px;}
  .order-item{
    display:flex;align-items:center;gap:10px;
    background:var(--bg-deep);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    font-weight:700;font-size:14.5px;
  }
  .order-num{
    width:28px;height:28px;border-radius:50%;background:var(--purple);color:white;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;
  }
  .order-arrows{display:flex;gap:4px;margin-inline-start:auto;}
  .arrow-btn{
    width:30px;height:30px;border-radius:50%;background:white;font-size:14px;font-weight:800;
    box-shadow:0 2px 4px rgba(0,0,0,.12); color:var(--ink-soft);
  }
  .arrow-btn:disabled{opacity:.3;}

  .match-grid{display:flex;flex-direction:column;gap:16px;}
  .match-col-title{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin-bottom:8px;}
  .match-items{display:flex;flex-direction:column;gap:8px;}
  .match-chip{
    background:var(--bg-deep);
    border-radius:var(--radius-sm);
    padding:11px 14px;font-weight:700;font-size:13.5px;
    border:2.5px solid transparent;
  }
  .match-chip.selected{border-color:var(--blue);background:#E4F0FE;}
  .match-chip.paired{background:#DFF6EA;border-color:var(--green);opacity:.85;}
  .match-chip.wrong-flash{border-color:var(--red);animation:shake .35s;}

  .submit-btn{
    margin-top:20px;
    width:100%;
    padding:15px;
    border-radius:999px;
    background:var(--blue);
    color:white;
    font-weight:800;font-size:16px;
    box-shadow:0 8px 0 var(--blue-deep);
  }
  .submit-btn:disabled{opacity:.45;box-shadow:0 8px 0 rgba(28,99,196,0.45);}
  .submit-btn:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 var(--blue-deep);}

  .feedback-banner{
    margin-top:18px;
    border-radius:var(--radius-md);
    padding:16px 18px;
    font-weight:800;
    font-size:15px;
    display:flex;align-items:center;gap:10px;
    animation:pop-in .25s ease;
  }
  .feedback-banner.good{background:#DFF6EA;color:var(--green-deep);}
  .feedback-banner.bad{background:#FDE9E5;color:#B9422E;}
  .stars-earned{font-size:20px;margin-inline-start:auto;white-space:nowrap;}
  .next-btn{
    margin-top:14px;width:100%;padding:14px;border-radius:999px;
    background:var(--ink);color:white;font-weight:800;font-size:15px;
  }

  /* ---------- BADGE / LEVEL COMPLETE ---------- */
  .badge-screen{text-align:center;padding:20px 10px;}
  .badge-medal{
    width:130px;height:130px;border-radius:50%;
    margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;
    font-size:60px;
    background:conic-gradient(from 200deg, var(--yellow), var(--orange), var(--yellow));
    box-shadow:0 14px 0 rgba(0,0,0,0.08), var(--shadow-soft);
    animation:badge-pop .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes badge-pop{from{transform:scale(0) rotate(-30deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .badge-name{font-size:24px;font-weight:800;margin:0 0 6px;}
  .badge-desc{color:var(--ink-soft);font-weight:600;margin:0 0 22px;}

  /* ---------- ACHIEVEMENTS ---------- */
  .ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .ach-card{
    background:var(--white);border-radius:var(--radius-md);padding:16px 10px;text-align:center;
    box-shadow:var(--shadow-soft);
  }
  .ach-card.locked{opacity:.4;}
  .ach-emoji{font-size:36px;display:block;margin-bottom:6px;}
  .ach-name{font-weight:800;font-size:13.5px;}

  /* ---------- END SCREEN ---------- */
  .end-screen{
    text-align:center;
    background:linear-gradient(160deg, var(--purple) 0%, var(--blue) 100%);
    border-radius:var(--radius-lg);
    padding:34px 20px;
    color:white;
    position:relative;
    overflow:hidden;
  }
  .confetti{position:absolute;top:-20px;font-size:20px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(560px) rotate(360deg);opacity:0;}}
  .trophy{font-size:74px;display:block;margin-bottom:6px;}
  .end-title{font-size:27px;font-weight:800;margin:4px 0 10px;position:relative;z-index:2;}
  .end-msg{font-size:15px;font-weight:600;line-height:1.8;opacity:.95;max-width:420px;margin:0 auto 20px;position:relative;z-index:2;}
  .stat-row{display:flex;justify-content:center;gap:10px;margin-bottom:24px;position:relative;z-index:2;flex-wrap:wrap;}
  .stat-chip{background:rgba(255,255,255,0.18);border-radius:16px;padding:12px 16px;min-width:84px;}
  .stat-chip b{display:block;font-size:20px;}
  .stat-chip span{font-size:11.5px;font-weight:700;opacity:.9;}
  .end-actions{display:flex;flex-direction:column;gap:10px;position:relative;z-index:2;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(35,48,75,0.55);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-box{
    background:white;border-radius:var(--radius-lg);padding:26px 22px;max-width:420px;width:100%;
    max-height:80vh;overflow-y:auto;
  }
  .modal-box h3{margin-top:0;font-size:22px;}
  .modal-box li{margin-bottom:8px;font-weight:600;font-size:14.5px;line-height:1.6;}
  .modal-close{margin-top:14px;width:100%;padding:13px;border-radius:999px;background:var(--bg-deep);font-weight:800;}

  .teacher-footer{display:flex;align-items:center;justify-content:center;gap:12px;text-align:right;margin-top:28px;padding:14px 18px;color:var(--ink-soft);font-size:12px;font-weight:700;line-height:1.9;background:rgba(255,255,255,.72);border:1px solid rgba(35,48,75,.08);border-radius:18px;box-shadow:0 8px 20px -16px rgba(35,48,75,.28)}
  .teacher-footer img{width:62px;height:42px;object-fit:contain;flex:0 0 auto}
  .teacher-footer strong{color:var(--ink);font-size:13px}
  .teacher-footer span{display:block}
  .teacher-footer img{width:62px;height:42px;object-fit:contain;flex:0 0 auto}
  .teacher-footer strong{color:var(--ink);font-size:13px}
  .teacher-footer span{display:block}

  @media (max-width:480px){
    .home-title{font-size:27px;}
    .prompt{font-size:17px;}
    .path-node-row.left, .path-node-row.right{justify-content:flex-start;flex-direction:row;}
    .path-node-row.left .node{flex-direction:row;padding:10px 20px 10px 10px;text-align:right;}
    .path-node-row.left .node.done::after{left:-6px;right:auto;}
    .connector{margin:0 34px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001s !important; transition-duration:0.001s !important;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== DATA ===================== */
const LEVEL_META = [
  {emoji:'🧭', name:'قيادة الذات', desc:'الوعي بالاختيارات وتنظيم الانفعالات', color:'blue',   badge:{emoji:'🌱', name:'قائدة ذاتها'}},
  {emoji:'💬', name:'الحوار والاحترام', desc:'الإنصات والتعبير باحترام', color:'orange', badge:{emoji:'💬', name:'صوتها راقٍ'}},
  {emoji:'🤝', name:'التعاون والتعاطف', desc:'الإنصاف، المبادرة، وتقدير الآخرين', color:'green',  badge:{emoji:'🤝', name:'روح الفريق'}},
  {emoji:'📱', name:'السلوك الرقمي', desc:'خصوصية وأمان ومسؤولية على الإنترنت', color:'purple', badge:{emoji:'🛡️', name:'حارسة الأثر الرقمي'}},
  {emoji:'🏫', name:'قدوة في مدرستي', desc:'المسؤولية والنزاهة وصناعة أثر إيجابي', color:'red', badge:{emoji:'👑', name:'بطلة السلوك الإيجابي'}},
];

const LEVELS = [
  { // 1 - قيادة الذات
    challenges: [
      {type:'mc', prompt:'لديكِ مشروع مدرسي كبير وموعد تسليمه قريب. ما الخطوة الأكثر فاعلية؟',
        options:[
          {text:'أقسّم العمل إلى مهام صغيرة وأبدأ بالأولوية', correct:true},
          {text:'أؤجل كل شيء حتى الليلة الأخيرة', correct:false},
          {text:'أشعر بالقلق وأترك المشروع دون خطة', correct:false},
        ],
        good:'أحسنتِ! التخطيط خطوة أولى نحو إنجاز هادئ ومتقن 🌟',
        bad:'فكّري: أي اختيار يساعدك على إدارة وقتك وتقليل التوتر؟'},
      {type:'tf', prompt:'إذا أخطأتُ في إجابة أو تصرف، أستطيع الاعتراف بالخطأ والتعلّم منه بدل لوم الآخرين.', answer:true,
        good:'صحيح! تحمّل المسؤولية عن الخطأ دليل قوة ونضج 👏',
        bad:'تذكّري: الاعتراف بالخطأ يفتح باب التعلّم والتحسين.'},
      {type:'order', prompt:'رتّبي خطوات التعامل مع موقف أزعجك قبل الرد',
        steps:['أتوقف لحظة وأهدأ', 'أفكر في أثر كلماتي', 'أعبّر عن شعوري باحترام'],
        good:'رائع! التمهّل يساعدك على اختيار ردّ بنّاء ⭐',
        bad:'قريب جدًا! ابدئي بالهدوء قبل التفكير في الرد.'},
    ]
  },
  { // 2 - الحوار والاحترام
    challenges: [
      {type:'mc', prompt:'اختلفتِ مع زميلة في نقاش صفي. أي ردّ يحافظ على الاحترام ويفتح باب الحوار؟',
        options:[
          {text:'أقاطعها وأقول إن رأيها غير مهم', correct:false},
          {text:'أستمع ثم أقول: أفهم رأيك، وأود أن أشارك وجهة نظري', correct:true},
          {text:'أرفع صوتي حتى يقتنع الجميع برأيي', correct:false},
        ],
        good:'ممتاز! الاختلاف بأدب يثري الحوار ولا يقلل من احترام أحد 💬',
        bad:'حاولي مجددًا: الحوار الجيد يجمع بين الإنصات والتعبير المهذب.'},
      {type:'speed', prompt:'تحتاجين إلى توضيح نقطة لم تفهميها من المعلمة. اختاري العبارة الأنسب', seconds:12,
        options:[
          {text:'أعيدي الشرح، لم أفهم!', correct:false},
          {text:'لو سمحتِ، هل يمكن توضيح هذه النقطة؟', correct:true},
          {text:'هذا الشرح غير واضح', correct:false},
        ],
        good:'أحسنتِ! الطلب الواضح والمهذب يساعد على تواصل أفضل 🎉',
        bad:'تذكّري أن نبرة الكلام وكلماته تصنع فرقًا.'},
      {type:'tf', prompt:'الإنصات باهتمام يعني أن أمنح المتحدث فرصة لإكمال فكرته قبل أن أرد.', answer:true,
        good:'صحيح! الإنصات احترام، ويساعدنا على فهم الفكرة كاملة 👏',
        bad:'فكّري: هل يمكن فهم وجهة نظر الآخر إذا قاطعناه؟'},
    ]
  },
  { // 3 - التعاون والتعاطف
    challenges: [
      {type:'mc', prompt:'لاحظتِ أن زميلة جديدة تجلس وحدها خلال نشاط جماعي. ما المبادرة الإيجابية؟',
        options:[
          {text:'أدعوها للمشاركة وأوضح لها فكرة النشاط', correct:true},
          {text:'أفترض أنها لا تريد المشاركة وأتجاهلها', correct:false},
          {text:'أطلب من المجموعة عدم إشراكها', correct:false},

/* ===================== SOUND ===================== */
let audioCtx = null;
function getCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  return audioCtx;
}
function beep(freqs, dur, type){
  if(state.muted) return;
  try{
    const ctx = getCtx();
    freqs.forEach((f,i)=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type||'sine';
      o.frequency.value = f;
      g.gain.value = 0.06;
      o.connect(g); g.connect(ctx.destination);
      const start = ctx.currentTime + i*dur;
      g.gain.setValueAtTime(0.08, start);
      g.gain.exponentialRampToValueAtTime(0.001, start+dur*0.9);
      o.start(start); o.stop(start+dur);
    });
  }catch(e){}
}
function soundCorrect(){ beep([523,659,784], 0.14, 'triangle'); }
function soundWrong(){ beep([220,180], 0.18, 'sawtooth'); }
function soundLevelUp(){ beep([392,494,587,784], 0.16, 'triangle'); }
function soundClick(){ beep([700], 0.05, 'sine'); }

function shuffled(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function hud(showBack){

  <div class="hud">
    ${showBack ? `<button class="hud-back" data-action="goMap">↩ الخريطة</button>` : `<div class="hud-item">🏫 <b>بطلة السلوك</b></div>`}

    </div>

  </div>`;
}

function currentChallengeData(){

function renderChallenge(){
  const meta = LEVEL_META[state.currentLevel];

  let bodyHtml = '';
  if(ch.type==='mc' || ch.type==='speed'){

  } else if(ch.type==='tf'){

    bodyHtml = renderMatch(ch);

  let timerHtml = '';
  if(ch.type==='speed' && !state.answered){
    const pct = Math.max(0, (state.timeLeft/ch.seconds)*100);
    timerHtml = `<div class="timer-bar"><div class="timer-fill" style="width:${pct}%;"></div></div>`;
  }

  let feedbackHtml = '';
  if(state.answered){

function renderMC(ch){
  const opts = state._shuffledOptions || (state._shuffledOptions = shuffled(ch.options));
  const optsHtml = opts.map((o,i)=>{
    let cls = 'opt-card';
    if(state.answered){
      cls += ' disabled';
      if(o.correct) cls += ' correct';
      else if(i===state.selectedIndex) cls += ' wrong';
    }
    return `<div class="${cls}" ${state.answered?'':`data-action="pickOption" data-idx="${i}"`}>
      <span class="opt-emoji">${state.answered && o.correct ? '✅' : (state.answered && i===state.selectedIndex ? '❌' : '🔷')}</span>
      <span>${o.text}</span>
    </div>`;
  }).join('');
  return `<div class="options">${optsHtml}</div>`;
}

function renderTF(ch){
  const disabled = state.answered;
  function cls(val){
    let c = 'tf-btn';
    if(disabled){
      if(val===ch.answer) c += ' correct opt-card';
      else if(state.selectedIndex===val) c += ' wrong opt-card';
    }
    return c;
  }
  return `
    <div class="tf-row">
      <button class="${cls(true)}" ${disabled?'disabled':'data-action="pickTF" data-val="true"'}>✅ صح</button>
      <button class="${cls(false)}" ${disabled?'disabled':'data-action="pickTF" data-val="false"'}>❌ خطأ</button>
    </div>
  `;
}

function renderOrder(ch){
  if(!state.orderArr){ state.orderArr = shuffled(ch.steps.map((s,i)=>i)); }
  const itemsHtml = state.orderArr.map((stepIdx, pos)=>{
    return `
    <div class="order-item">
      <div class="order-num">${pos+1}</div>
      <span>${ch.steps[stepIdx]}</span>
      <div class="order-arrows">
        <button class="arrow-btn" data-action="orderMove" data-pos="${pos}" data-dir="up" ${pos===0?'disabled':''}>▲</button>
        <button class="arrow-btn" data-action="orderMove" data-pos="${pos}" data-dir="down" ${pos===state.orderArr.length-1?'disabled':''}>▼</button>
      </div>
    </div>`;
  }).join('');
  const canSubmit = !state.answered;
  return `
    <div class="order-list">${itemsHtml}</div>
    ${!state.answered ? `<button class="submit-btn" data-action="submitOrder">تأكيد الترتيب ✔️</button>` : ''}
  `;
}

function renderMatch(ch){
  if(!state._matchA){
    state._matchA = shuffled(ch.pairs.map((p,i)=>i));
    state._matchB = shuffled(ch.pairs.map((p,i)=>i));
  }
  const aHtml = state._matchA.map(i=>{
    const paired = state.matchPaired.find(p=>p.aIdx===i);
    let cls = 'match-chip';
    if(paired) cls += ' paired';
    else if(state.matchSelectedA===i) cls += ' selected';
    if(state._wrongFlashA===i) cls += ' wrong-flash';
    return `<div class="${cls}" ${paired||state.answered?'':`data-action="matchPickA" data-idx="${i}"`}>${ch.pairs[i].a}</div>`;
  }).join('');
  const bHtml = state._matchB.map(i=>{
    const paired = state.matchPaired.find(p=>p.bIdx===i);
    let cls = 'match-chip';
    if(paired) cls += ' paired';
    if(state._wrongFlashB===i) cls += ' wrong-flash';
    return `<div class="${cls}" ${paired||state.answered?'':`data-action="matchPickB" data-idx="${i}"`}>${ch.pairs[i].b}</div>`;
  }).join('');
  return `
    <div class="match-grid">
      <div>
        <p class="match-col-title">السلوك</p>
        <div class="match-items">${aHtml}</div>
      </div>
      <div>
        <p class="match-col-title">النتيجة</p>
        <div class="match-items">${bHtml}</div>
      </div>
    </div>
  `;
}

/* ===================== MASTER RENDER ===================== */
let pendingHowTo = false;
function render(){
  let html = '';
  if(state.screen==='home') html = renderHome();
  else if(state.screen==='map') html = renderMap();
  else if(state.screen==='challenge') html = renderChallenge();
  else if(state.screen==='levelComplete') html = renderLevelComplete();
  else if(state.screen==='achievements') html = renderAchievements();
  else if(state.screen==='end') html = renderEnd();
  document.getElementById('app').innerHTML = html + (pendingHowTo ? renderHowTo() : '');
}

/* ===================== ACTIONS ===================== */
function startChallengeState(){
  state.answered = false;
  state.selectedIndex = null;
  state.orderArr = null;
  state.matchSelectedA = null;
  state.matchPaired = [];
  state._shuffledOptions = null;
  state._matchA = null;
  state._matchB = null;
  state._wrongFlashA = null;
  state._wrongFlashB = null;
  clearTimer();
  const ch = currentChallengeData();
  if(ch && ch.type==='speed'){
    state.timeLeft = ch.seconds;
    state.timerId = setInterval(()=>{
      state.timeLeft = Math.max(0, state.timeLeft - 0.1);
      const fill = document.querySelector('.timer-fill');
      if(fill) fill.style.width = `${(state.timeLeft/ch.seconds)*100}%`;
      if(state.timeLeft<=0){
        clearTimer();
        if(!state.answered) handleAnswer(false, null);
      }
    }, 100);
  }
}

function handleAnswer(correct, idx){
  if(state.answered) return;
  clearTimer();
  state.answered = true;
  state.selectedIndex = idx;
  state.lastCorrect = correct;
  state.totalAnswered++;
  const ch = currentChallengeData();
  if(correct){
    state.correctFirstTry++;
    let pts = 10;
    if(ch.type==='speed') pts += 5;
    if(ch.final) pts += 20;
    state.points += pts;
    state.stars += 1;
    state.lastPoints = pts;
    soundCorrect();
  } else {
    state.levelMistakeFree[state.currentLevel] = false;
    soundWrong();
  }
  render();
}

function goToLevelComplete(){
  const li = state.currentLevel;
  if(!state.levelDone[li]){
    state.levelDone[li] = true;
    if(state.levelMistakeFree[li]) state.points += 10;
  }
  soundLevelUp();
  state.screen = 'levelComplete';
  render();
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='startAdventure'){ soundClick(); state.screen='map'; render(); }
  else if(action==='goMap'){ soundClick(); clearTimer(); state.screen='map'; render(); }
  else if(action==='goHome'){ soundClick(); state.screen='home'; render(); }
  else if(action==='showAchievements'){ soundClick(); state.screen='achievements'; render(); }
  else if(action==='showHowTo'){ pendingHowTo = true; render(); }
  else if(action==='closeModal'){ pendingHowTo = false; render(); }
  else if(action==='toggleMute'){ state.muted = !state.muted; render(); }
  else if(action==='resetGame'){ resetGame(); }
  else if(action==='goEnd'){ soundClick(); clearTimer(); state.screen='end'; render(); }

  else if(action==='openLevel'){
    soundClick();
    state.currentLevel = parseInt(el.dataset.level,10);
    state.currentChallenge = 0;
    startChallengeState();
    state.screen = 'challenge';
    render();
  }

  else if(action==='pickOption'){
    const idx = parseInt(el.dataset.idx,10);
    const ch = currentChallengeData();
    const opts = state._shuffledOptions;
    handleAnswer(opts[idx].correct, idx);
  }

  else if(action==='pickTF'){
    const val = el.dataset.val === 'true';
    const ch = currentChallengeData();
    handleAnswer(val === ch.answer, val);
  }

  else if(action==='orderMove'){
    const pos = parseInt(el.dataset.pos,10);
    const dir = el.dataset.dir;
    const arr = state.orderArr;
    const swapWith = dir==='up' ? pos-1 : pos+1;
    if(swapWith<0 || swapWith>=arr.length) return;
    [arr[pos], arr[swapWith]] = [arr[swapWith], arr[pos]];
    soundClick();
    render();
  }

  else if(action==='submitOrder'){
    const ch = currentChallengeData();
    const correct = state.orderArr.every((v,i)=>v===i);
    handleAnswer(correct, null);
  }

  else if(action==='matchPickA'){
    if(state.answered) return;
    state.matchSelectedA = parseInt(el.dataset.idx,10);
    render();
  }

  else if(action==='matchPickB'){
    if(state.answered || state.matchSelectedA===null) return;
    const bIdx = parseInt(el.dataset.idx,10);
    const aIdx = state.matchSelectedA;
    if(aIdx===bIdx){
      state.matchPaired.push({aIdx,bIdx});
      state.matchSelectedA = null;
      soundClick();
      const ch = currentChallengeData();
      if(state.matchPaired.length === ch.pairs.length){
        handleAnswer(true, null);
      } else {
        render();
      }
    } else {
      state._wrongFlashA = aIdx;
      state._wrongFlashB = bIdx;
      state.matchSelectedA = null;
      soundWrong();
      render();
      setTimeout(()=>{ state._wrongFlashA=null; state._wrongFlashB=null; render(); }, 400);
    }
  }

  else if(action==='nextChallenge'){
    const total = LEVELS[state.currentLevel].challenges.length;
    if(state.currentChallenge < total-1){
      state.currentChallenge++;
      startChallengeState();
      render();
    } else {
      goToLevelComplete();
    }
  }
});

render();
</script>
</body>
</html>
